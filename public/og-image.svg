<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4a8cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7eb6ff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#070a13"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowTop)"/>
  <rect width="1200" height="630" fill="url(#glowBottom)"/>

  <!-- logo mark -->
  <g transform="translate(110 110) scale(3.6)">
    <path d="M26 16h12a3 3 0 0 1 3 3v4" fill="none" stroke="#2050d8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M32 24H18a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h14" fill="none" stroke="#2050d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 24h14a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H32" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 32l5 5 10-10" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800">
    <text x="370" y="240" font-size="128" letter-spacing="-2">
      <tspan fill="#e6edf7">Chain</tspan><tspan fill="#4a8cff">Work</tspan>
    </text>
  </g>

  <!-- slogan -->
  <g font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="110" y="400" font-size="52" font-weight="700" fill="#ffffff">Small tasks.</text>
    <text x="370" y="400" font-size="52" font-weight="700" fill="url(#accentText)">Trusted workers.</text>
    <text x="760" y="400" font-size="52" font-weight="700" fill="#ffffff">Flexible payments.</text>
  </g>

  <!-- supporting line -->
  <text x="110" y="470" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.65)">
    Hire freelancers and get paid in crypto — borderless, instant, on-chain.
  </text>

  <!-- footer chip -->
  <g transform="translate(110 540)">
    <rect width="320" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="24" cy="24" r="5" fill="#2dd4bf"/>
    <text x="44" y="31" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.85)">
      Now in early access · chainwork.io
    </text>
  </g>
</svg>
